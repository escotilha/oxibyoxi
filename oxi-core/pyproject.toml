[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxi-core"
version = "0.1.0b1"
description = "Standalone, forkable autonomous coding orchestrator."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "escotilha" }]
keywords = ["orchestrator", "automation", "ci", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "PyYAML>=6.0",
  "anthropic>=0.88.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
  "pytest-timeout>=0.5",
  "ruff>=0.5",
  # cyclonedx-bom is also in release extras; dev needs it so the SBOM
  # unit tests (test_generate_sbom.py) can invoke scripts/generate-sbom.sh.
  "cyclonedx-bom>=7,<8",
]
release = [
  "build>=1.0",
  "twine>=5.0",
  "cyclonedx-bom>=7,<8",
]

[project.scripts]
oxi = "oxi_core.cli:main"

[project.urls]
Repository = "https://github.com/escotilha/oxi"
Documentation = "https://github.com/escotilha/oxi/tree/main/docs/manual"
"Release Notes" = "https://github.com/escotilha/oxi/releases"
Issues = "https://github.com/escotilha/oxi/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oxi_core*"]

[tool.setuptools.package-data]
"oxi_core" = ["skills/_bundled/**/*", "templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
markers = [
  "slow: end-to-end / integration tests; opt out via `-m 'not slow'`",
]
