[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxi-core"
version = "0.1.0b1"
description = "Standalone, forkable autonomous coding orchestrator."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "escotilha" }]
keywords = ["orchestrator", "automation", "ci", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "PyYAML>=6.0",
  "anthropic>=0.88.0,<1.0",
  "rich>=13,<15",
  "structlog>=24.1,<26",
  "httpx>=0.27,<1.0",
  "selectolax>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
  "pytest-timeout>=0.5",
  "pytest-cov>=5,<6",
  "ruff>=0.5",
  "mypy>=1.10,<2",
  "types-PyYAML",
  # cyclonedx-bom is also in release extras; dev needs it so the SBOM
  # unit tests (test_generate_sbom.py) can invoke scripts/generate-sbom.sh.
  "cyclonedx-bom>=7,<8",
]
release = [
  "build>=1.0",
  "twine>=5.0",
  "cyclonedx-bom>=7,<8",
]

[project.scripts]
oxi = "oxi_core.cli:main"

[project.urls]
Repository = "https://github.com/escotilha/oxi"
Documentation = "https://github.com/escotilha/oxi/tree/main/docs/manual"
"Release Notes" = "https://github.com/escotilha/oxi/releases"
Issues = "https://github.com/escotilha/oxi/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oxi_core*"]

[tool.setuptools.package-data]
"oxi_core" = ["skills/_bundled/**/*", "templates/**/*", "defaults/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
markers = [
  "slow: end-to-end / integration tests; opt out via `-m 'not slow'`",
  "integration: live-network probes against real GitHub API; skipped by default",
]

[tool.mypy]
# Project-wide baseline. Strict mode is enforced per-module via the
# overrides below. Adding strict to a module is a one-way ratchet:
# once a module is strict-clean, regressions fail CI. New modules
# should be written strict from day one and added to the list.
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true

# Strict modules — additions require a green CI run.
[[tool.mypy.overrides]]
module = [
  "oxi_core.adapter",
  "oxi_core.db",
  "oxi_core.v3.notification",
  "oxi_core.v3.budget",
  "oxi_core.v3.deadman",
  "oxi_core.v3.engine_health",
  "oxi_core.v3.oauth_watch",
  "oxi_core.v3.skills_loader",
  "oxi_core.v3.tail_dispatch",
  "oxi_core.v3.routing",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
disallow_untyped_decorators = true

[tool.coverage.run]
source = ["oxi_core"]
branch = false
omit = [
  # Skip the legacy v3 modules whose paths get exercised end-to-end
  # only via real Claude dispatch — counting them would suppress the
  # honest unit-test coverage signal. The integration paths get
  # covered by the dogfood loop and the first-fork smoke test in CI.
  "src/oxi_core/v3/auto_observe.py",
  "src/oxi_core/v3/github_client.py",
]

[tool.coverage.report]
# 85% global gate — current measured coverage is 89%. The 4-point
# slack absorbs honest CI flakes (timing-sensitive tests, transient
# subprocess timeouts) without letting real regressions in. Raise
# this floor any time the measured number rises and stays there.
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@overload",
]
