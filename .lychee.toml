# Lychee configuration for oxi doc lint.
#
# Conservative defaults: prefer false negatives (missed broken link)
# over false positives (CI red on a flaky external URL). The
# internal-link checks are the load-bearing part — those catch
# real bit-rot. External checks are best-effort.

# Network behaviour.
max_concurrency = 4
max_redirects = 5
timeout = 20
retry_wait_time = 2

# Cache external responses for a week. Reduces rate-limit pressure
# and speeds up re-runs on PRs that don't touch the affected docs.
cache = true
max_cache_age = "7d"

# Don't verify internal markdown anchors. Lychee's slugifier diverges
# from mkdocs's (em-dashes and other unicode chars produce different
# slugs), so an anchor like #step-5-write-your-roadmap that mkdocs
# resolves cleanly fails lychee with "Cannot find fragment". The
# mkdocs site build runs --strict in docs.yml and catches genuinely
# broken anchors during the actual render. Let lychee own URL
# resolution + missing-file checks; mkdocs owns anchor validation.
include_fragments = false

# Trim noise. These domains rate-limit aggressively or return 4xx
# to bots while serving humans fine; treat their links as opaque.
exclude = [
  # GitHub edit-this-page links — generated by the docs theme,
  # don't resolve until the file is on main.
  "^https://github.com/escotilha/oxi/edit/",
  # Localhost / private network refs from runbooks.
  "^https?://127\\.0\\.0\\.1",
  "^https?://localhost",
  "^https?://0\\.0\\.0\\.0",
  "^https?://(100\\.|10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[0-1])\\.)",
  # Tailscale MagicDNS hostnames — not reachable from CI runners.
  # These appear as example URLs in the litellm-gateway runbook.
  "^https?://[^/]+\\.tail[0-9a-z]+\\.ts\\.net",
  # Example placeholder URLs using angle-bracket template tokens.
  "<tailscale-hostname>",
  "<id>",
  # Placeholder asset slot — README references the screenshot before
  # it's been captured. docs/assets/README.md documents this is
  # intentional; the broken-image icon flags the pending screenshot.
  "oxi-tick-screenshot\\.png",
]

# Don't fail on transient infrastructure issues. 429 (rate-limit),
# 503 (service unavailable), 504 (gateway timeout) — surface them
# in the log but keep CI green.
accept = [200, 201, 202, 203, 204, 206, 301, 302, 303, 307, 308, 401, 403, 429, 503, 504]

# User-agent — many sites 403 the default lychee UA.
user_agent = "Mozilla/5.0 (compatible; lychee-link-checker; +https://lychee.cli.rs)"
