[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxi-adapter-self"
version = "0.0.0"
description = "Dogfood adapter — oxi operating on its own repo. Internal; not published to PyPI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "oxi-core",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-timeout>=0.5",
  "ruff>=0.5",
]

[project.entry-points."oxi.adapters"]
self = "oxi_adapter_self:SelfAdapter"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oxi_adapter_self*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
