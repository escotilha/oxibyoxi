[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxi-adapter-reference"
version = "0.1.0a3"
description = "Reference adapter for oxi. Drives the throwaway sample-project fixture."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "oxi-core==0.1.0a3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.5",
]

[project.entry-points."oxi.adapters"]
reference = "oxi_adapter_reference:ReferenceAdapter"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oxi_adapter_reference*"]

[tool.ruff]
line-length = 100
target-version = "py311"
