# CI workflow for oxi.
#
# Security review notes (per GitHub Actions injection guidance):
#   - No ${{ github.event.* }} interpolation anywhere in run: blocks.
#   - No user-controlled inputs (issue titles, PR bodies, commit messages,
#     branch refs) are passed to shell commands.
#   - permissions is set to contents: read (no write, no packages, no id-token).
#   - All run: commands execute static scripts or package managers against
#     checked-out code. No dynamic command construction from event payloads.
#   - No self-hosted runners.
#   - Third-party actions pinned to full commit SHAs (not mutable tag refs)
#     per OpenSSF guidance — prevents a compromised upstream actions/*
#     namespace from silently running new code in our CI.
#   - The only ${{ secrets.* }} reference is GITHUB_TOKEN in a safely-scoped
#     env: block on the gitleaks action (which needs it to post results).
#     permissions: contents: read further bounds what that token can do.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-for-leaks:
    name: lint-for-leaks (forbidden strings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Run leak-lint
        run: ./scripts/lint-for-leaks.sh

  gitleaks:
    name: gitleaks (secret patterns)
    runs-on: ubuntu-latest
    # gitleaks-action needs pull-requests: write to annotate the PR with
    # findings; without it the action crashes with "Resource not accessible
    # by integration". Scoped to this job only — other jobs stay at the
    # workflow-level contents: read.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install oxi-core + adapters (editable) + dev deps
        # Security review:
        #   - No ${{ github.event.* }} interpolation in this run: block.
        #   - Installs static path targets only; no dynamic input.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./oxi-core[dev]"
          python -m pip install -e "./adapters/_reference[dev]"
          python -m pip install -e "./adapters/_self[dev]"
      - name: Ruff (oxi-core)
        working-directory: oxi-core
        run: ruff check .
      - name: Ruff (reference adapter)
        working-directory: adapters/_reference
        run: ruff check .
      - name: Ruff (self adapter)
        working-directory: adapters/_self
        run: ruff check .
      - name: Pytest (oxi-core)
        working-directory: oxi-core
        run: pytest -q
      - name: Pytest (reference adapter)
        working-directory: adapters/_reference
        run: pytest -q
      - name: Pytest (self adapter)
        working-directory: adapters/_self
        run: pytest -q

  first-fork-smoke:
    name: first-fork smoke (wheel → oxi init → tick)
    runs-on: ubuntu-latest
    # Security review:
    #   - No ${{ github.event.* }} interpolation anywhere in run: blocks.
    #   - The smoke script uses only static paths inside a mktemp workspace.
    #   - No secrets consumed; ANTHROPIC_API_KEY is intentionally absent
    #     (the test exercises reconciliation-only tick, not real Claude).
    #   - The `build` step produces a wheel from the checked-out source;
    #     no external packages are fetched beyond PyPI build deps.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Run first-fork smoke test
        # Security review:
        #   - No ${{ github.event.* }} interpolation in this run: block.
        #   - Script invoked with a static path; no dynamic input.
        run: bash scripts/smoke/first-fork.sh

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install pip-audit + oxi-core
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e "./oxi-core[dev]"
          python -m pip install -e "./adapters/_reference[dev]"
      - name: Run pip-audit
        # Security review:
        #   - No ${{ github.event.* }} interpolation in this run: block.
        #   - pip-audit invoked with static flags only. No dynamic input.
        # --ignore-vuln entries target CVEs in pip itself (the CI-image
        # installer), not runtime deps of oxi. Revisit when the CI image
        # ships a newer pip.
        # Approach: pip freeze --exclude-editable drops our own packages
        # (oxi-core, oxi-adapter-reference) because they aren't on PyPI
        # at this version yet. We feed the filtered list to pip-audit so
        # it scans all third-party deps without trying to resolve our
        # unreleased versions. --strict turns any finding into a CI fail.
        run: |
          python -m pip freeze --exclude-editable > /tmp/audit-reqs.txt
          pip-audit --strict -r /tmp/audit-reqs.txt --ignore-vuln CVE-2025-8869 --ignore-vuln CVE-2026-1703
