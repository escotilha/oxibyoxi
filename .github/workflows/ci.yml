# CI workflow for oxi.
#
# Runner strategy:
#   - Default to GitHub-hosted ubuntu-latest. Public OSS repos get
#     unlimited concurrent free runners (no third-party gate, no
#     verification queue). When a faster-runner provider is wired up
#     (Blacksmith, Ubicloud, Depot…) flip the default by editing the
#     fallback string here, or by setting the repo Variable OXI_RUNNER
#     to the new label.
#   - The OXI_RUNNER repo-scoped Variable overrides every job uniformly.
#     Set it to "oxi-vps" to route to the self-hosted runner (label
#     advertised by the VPS), or to a Blacksmith / Ubicloud label
#     once that vendor is verified.
#   - Every job — including CodeQL — runs on the same expression so
#     the override flips the entire workflow uniformly. CodeQL is
#     already continue-on-error so a runner-side hiccup can't block
#     PRs.
#
# Security review notes (per GitHub Actions injection guidance):
#   - No github.event.* interpolation anywhere in run: blocks.
#   - No user-controlled inputs (issue titles, PR bodies, commit messages,
#     branch refs) are passed to shell commands.
#   - permissions is set to contents: read (no write, no packages, no id-token).
#   - All run: commands execute static scripts or package managers against
#     checked-out code. No dynamic command construction from event payloads.
#   - vars.OXI_RUNNER is a repo-scoped GitHub Actions Variable, not a
#     secret. Only the repo admin can edit Variables, and the value only
#     flows into runs-on: — never into run: blocks or any expression that
#     reaches the shell. This is the supported way to parameterise runner
#     labels per the GitHub Actions docs.
#   - Third-party actions pinned to full commit SHAs (not mutable tag refs)
#     per OpenSSF guidance — prevents a compromised upstream actions/*
#     namespace from silently running new code in our CI.
#   - The only secrets.* reference is GITHUB_TOKEN in safely-scoped
#     env: / permissions: blocks (gitleaks needs pull-requests: write to
#     annotate; CodeQL needs security-events: write to upload SARIF).
#     Both are scoped to the individual job, not the workflow.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-for-leaks:
    name: lint-for-leaks (forbidden strings)
    runs-on: ${{ vars.OXI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Run leak-lint
        run: ./scripts/lint-for-leaks.sh

  gitleaks:
    name: gitleaks (secret patterns)
    runs-on: ${{ vars.OXI_RUNNER || 'ubuntu-latest' }}
    # We invoke the gitleaks CLI directly rather than the
    # gitleaks/gitleaks-action wrapper. Reason: the wrapper requires
    # a paid license for any account it identifies as an organisation
    # (which Xurman/oxi triggered after the repo transfer). The
    # gitleaks scanner itself is open-source and unrestricted — same
    # rules, same detection, just without the SaaS gate.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI
        # Pin to a specific release tag rather than `latest` so a
        # rule-set update doesn't change scan behaviour mid-PR. Bump
        # GITLEAKS_VERSION on a deliberate cadence, not silently.
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        # detect runs against the working tree + git history. --redact
        # masks any matched secret in the log output. --exit-code 1
        # makes a finding fail the job (default behaviour, made explicit).
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --exit-code 1 \
            --verbose

  python:
    name: python ${{ matrix.python-version }}
    runs-on: ${{ vars.OXI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install oxi-core + adapters (editable) + dev deps
        # Security review:
        #   - No ${{ github.event.* }} interpolation in this run: block.
        #   - Installs static path targets only; no dynamic input.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./oxi-core[dev]"
          python -m pip install -e "./adapters/_reference[dev]"
          python -m pip install -e "./adapters/_self[dev]"
      - name: Ruff (oxi-core)
        working-directory: oxi-core
        run: ruff check .
      - name: Ruff (reference adapter)
        working-directory: adapters/_reference
        run: ruff check .
      - name: Ruff (self adapter)
        working-directory: adapters/_self
        run: ruff check .
      - name: Mypy strict (allow-listed modules)
        working-directory: oxi-core
        # The mypy strict policy is enforced per-module via tool.mypy
        # overrides in pyproject.toml. Adding a module to the strict
        # list is a one-way ratchet: regressions fail this step.
        run: |
          mypy \
            src/oxi_core/adapter.py \
            src/oxi_core/db.py \
            src/oxi_core/v3/notification.py \
            src/oxi_core/v3/budget.py \
            src/oxi_core/v3/deadman.py \
            src/oxi_core/v3/engine_health.py \
            src/oxi_core/v3/oauth_watch.py \
            src/oxi_core/v3/skills_loader.py \
            src/oxi_core/v3/tail_dispatch.py
      - name: Pytest (oxi-core)
        working-directory: oxi-core
        run: pytest -q
      - name: Pytest (reference adapter)
        working-directory: adapters/_reference
        run: pytest -q
      - name: Pytest (self adapter)
        working-directory: adapters/_self
        run: pytest -q

  first-fork-smoke:
    name: first-fork smoke (wheel → oxi init → tick)
    runs-on: ${{ vars.OXI_RUNNER || 'ubuntu-latest' }}
    # Security review:
    #   - No ${{ github.event.* }} interpolation anywhere in run: blocks.
    #   - The smoke script uses only static paths inside a mktemp workspace.
    #   - No secrets consumed; ANTHROPIC_API_KEY is intentionally absent
    #     (the test exercises reconciliation-only tick, not real Claude).
    #   - The `build` step produces a wheel from the checked-out source;
    #     no external packages are fetched beyond PyPI build deps.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Run first-fork smoke test
        # Security review:
        #   - No ${{ github.event.* }} interpolation in this run: block.
        #   - Script invoked with a static path; no dynamic input.
        run: bash scripts/smoke/first-fork.sh

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ${{ vars.OXI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install pip-audit + oxi-core
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e "./oxi-core[dev]"
          python -m pip install -e "./adapters/_reference[dev]"
      - name: Run pip-audit
        # Security review:
        #   - No ${{ github.event.* }} interpolation in this run: block.
        #   - pip-audit invoked with static flags only. No dynamic input.
        # --ignore-vuln entries target CVEs in pip itself (the CI-image
        # installer), not runtime deps of oxi. Revisit when the CI image
        # ships a newer pip.
        # Approach: pip freeze --exclude-editable drops our own packages
        # (oxi-core, oxi-adapter-reference) because they aren't on PyPI
        # at this version yet. We feed the filtered list to pip-audit so
        # it scans all third-party deps without trying to resolve our
        # unreleased versions. --strict turns any finding into a CI fail.
        run: |
          python -m pip freeze --exclude-editable > /tmp/audit-reqs.txt
          pip-audit --strict -r /tmp/audit-reqs.txt --ignore-vuln CVE-2025-8869 --ignore-vuln CVE-2026-1703

  bandit:
    name: bandit (Python SAST)
    runs-on: ${{ vars.OXI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install bandit
        # Security review:
        #   - No ${{ github.event.* }} interpolation in this run: block.
        #   - bandit is installed at a pinned minimum version; no dynamic input.
        run: python -m pip install --upgrade pip "bandit[toml]>=1.8"
      - name: Run bandit (oxi-core)
        # Security review:
        #   - Invoked with static flags only.  No dynamic input.
        #   - Skip list in .bandit.yaml covers intentional patterns only;
        #     see that file for per-ID rationale.
        #   - B603 (subprocess_without_shell_equals_true) is skipped because
        #     oxi deliberately uses argv-form list subprocess for git/gh/claude.
        #     B602 (shell=True) is NOT skipped — regressions there are real.
        #   - B607 (start_process_with_partial_path) is skipped because oxi
        #     resolves binaries via the operator's PATH by design.
        run: |
          bandit -r oxi-core/src \
            -c .bandit.yaml \
            --severity-level medium \
            --confidence-level medium
      - name: Run bandit (adapters)
        run: |
          bandit -r adapters/_reference/src adapters/_self/src \
            -c .bandit.yaml \
            --severity-level medium \
            --confidence-level medium

  codeql:
    name: CodeQL (Python taint analysis)
    runs-on: ${{ vars.OXI_RUNNER || 'ubuntu-latest' }}
    # Security review:
    #   - No ${{ github.event.* }} interpolation in this job.
    #   - Static action invocations only; no dynamic command construction.
    # continue-on-error because CodeQL's SARIF upload requires GitHub
    # Advanced Security, not available on private repos without a
    # subscription. Scan still runs; findings appear in the job log.
    # When this repo goes public (or GHAS is enabled), drop
    # continue-on-error so CodeQL failures block PRs.
    continue-on-error: true
    # CodeQL needs security-events: write to upload the SARIF results file
    # so findings surface as PR annotations in the Security tab.
    # contents: read is sufficient for checkout + analysis.
    # Scoped to this job only — other jobs retain the workflow-level
    # contents: read.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Initialize CodeQL
        # Security review:
        #   - SHA-pinned to github/codeql-action v3.35.2 tag SHA.
        #   - languages: python — no compiled-language autobuild step needed.
        #   - No ${{ github.event.* }} interpolation.
        #   - queries: security-extended adds taint-flow and injection checks
        #     on top of the default security suite.
        uses: github/codeql-action/init@b2f9ef845756500b97acbdaf5c1dd4e9c1d15734  # v3.35.2
        with:
          languages: python
          queries: security-extended
      - name: Perform CodeQL Analysis
        # Security review:
        #   - Same SHA pin as the init step above (same action release).
        #   - No dynamic input; output goes to GitHub's security dashboard.
        uses: github/codeql-action/analyze@b2f9ef845756500b97acbdaf5c1dd4e9c1d15734  # v3.35.2
        with:
          category: "/language:python"
